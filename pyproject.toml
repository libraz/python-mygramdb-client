[project]
name = "mygramdb-client"
version = "1.4.0"
description = "Python client for MygramDB - high-performance in-memory full-text search engine with MySQL replication support"
authors = [
    { name = "libraz", email = "libraz@libraz.net" }
]
license = { text = "MIT" }
dependencies = []
readme = "README.md"
requires-python = ">= 3.9"
keywords = ["mygramdb", "full-text-search", "database", "client", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/libraz/python-mygramdb-client"
Repository = "https://github.com/libraz/python-mygramdb-client"
Issues = "https://github.com/libraz/python-mygramdb-client/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mygramdb_client"]

# flake8 does not read pyproject.toml; its configuration lives in .flake8.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# 3.10 is the oldest target mypy accepts; the package itself still supports 3.9.
python_version = "3.10"
files = ["src/mygramdb_client"]
ignore_missing_imports = true
warn_unused_ignores = true
